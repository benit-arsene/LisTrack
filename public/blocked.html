<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Goal Reached — LisTrack</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="screen">
    <div class="card fade-in">
      <div class="card-top">
        <div class="logo">L</div>
        <span class="logo-label">LisTrack</span>
      </div>

      <div class="icon-wrap">
        <svg class="icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
        </svg>
      </div>

      <div class="favicon-row">
        <img id="siteFavicon" src="" alt="" />
        <span id="siteDomain" class="domain">—</span>
      </div>

      <h1 class="title">Daily Goal Reached</h1>
      <p class="subtitle">You've hit your daily screen-time limit for this site.</p>

      <div class="time-box">
        <span class="time-label">Time spent today</span>
        <span class="time-value" id="timeSpent">0m</span>
      </div>

      <p class="tip">Tip: step away for a few minutes — your focus will thank you. 🌿</p>

      <div class="actions">
        <button class="btn-primary" id="goBackBtn">Take me back</button>
        <button class="btn-ghost" id="unblockBtn">Unblock for today</button>
      </div>

      <p class="hint">The limit resets automatically at midnight.</p>
    </div>
  </div>

  <script src="js/blocker.js"></script>
  <script src="js/blocked.js"></script>
</body>
</html>
